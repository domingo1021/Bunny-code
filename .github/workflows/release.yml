# Continuous delivery for the Spring Boot API: every push to `main` that passes CI is
# published as a Docker image and rolled out to production. See docs/CICD.md.
#
#   ci       the whole of ci.yml
#   publish  image → ghcr.io/<owner>/bunny-api:{sha-<commit>, main}
#   deploy   sync the compose stack to the server, then Docker/deploy/deploy.sh api <tag>:
#            pull, restart `api`, wait for /actuator/health/readiness, roll back on failure
#
# Re-deploy or roll back by hand: Actions → release → Run workflow, with an existing tag.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to deploy (e.g. sha-1a2b3c4d5e6f). Empty = build this commit."
        required: false
        default: ""

concurrency:
  # One release at a time; a newer push waits rather than racing a deploy in progress.
  group: release-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    if: ${{ inputs.tag == '' }}
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish image
    needs: ci
    if: ${{ inputs.tag == '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - id: image
        # Registry paths must be lower case; the owner name may not be.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bunny-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.tag.outputs.tag }}
            ${{ steps.image.outputs.name }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          provenance: true
          sbom: true

  deploy:
    name: deploy to production
    needs: [publish]
    # Runs after a successful publish, or on its own for a manual re-deploy/rollback.
    if: ${{ always() && (needs.publish.result == 'success' || inputs.tag != '') }}
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ inputs.tag != '' && inputs.tag || needs.publish.outputs.tag }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' \
            "$HOST" "$USER_NAME" >> ~/.ssh/config

      # The stack definition lives in this repo; server-owned files (TLS material, the real
      # nginx site, the sandbox key, deploy state) are never overwritten.
      - name: Sync the compose stack
        run: |
          rsync -az --delete \
            --exclude 'local/' \
            --exclude 'secrets/' \
            --exclude 'deploy/images.env' \
            --exclude 'ReverseProxy/sites-enabled/bunny.conf' \
            --exclude 'ReverseProxy/*.crt' \
            --exclude 'ReverseProxy/*.key' \
            --exclude 'Cache/redis.conf' \
            Docker/ "prod:${DEPLOY_PATH}/Docker/"

      # A short-lived registry login for the pull: the job's own token, sent on stdin so it
      # never appears in a command line, and removed again whatever happens.
      - name: Log the server in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh prod "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Roll out api:${{ env.TAG }}
        run: ssh prod "'$DEPLOY_PATH/Docker/deploy/deploy.sh' api '$TAG'"

      - name: Log the server out of GHCR
        if: always()
        run: ssh prod "docker logout ghcr.io" || true
