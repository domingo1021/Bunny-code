# Template for sites-enabled/bunny.conf (the real file is not committed: it names the
# domain and certificate paths). One origin for the whole product:
#
#   /           → web  (Next.js server, server-side rendering)
#   /api/       → api  (Spring Boot: REST /api/v2 and the STOMP WebSocket /api/v2/ws)
#
# `web` and `api` are Docker Compose service names. They are resolved per request through
# Docker's DNS (127.0.0.11) rather than once at start-up, so redeploying either container —
# which gives it a new IP — never leaves nginx proxying to a dead address.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen      80;
  server_name _;
  # Everything is served over HTTPS.
  return 301 https://$host$request_uri;
}

server {
  listen      443 ssl default_server;
  listen      [::]:443 ssl default_server;
  http2       on;
  server_name domingoos.store www.domingoos.store;

  ssl_certificate     /etc/nginx/certs/certificate_final.crt;
  ssl_certificate_key /etc/nginx/certs/private.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 2m;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $web_upstream http://web:3000;
  set $api_upstream http://api:8080;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Port  $server_port;

  # Spring Boot: REST and the STOMP WebSocket, which needs the Upgrade headers and a long
  # read timeout (a battle room can sit quietly between heartbeats).
  location /api/ {
    proxy_pass         $api_upstream;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  # Next.js. Its hashed build assets never change, so they can be cached for good.
  location /_next/static/ {
    proxy_pass $web_upstream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    proxy_pass       $web_upstream;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
